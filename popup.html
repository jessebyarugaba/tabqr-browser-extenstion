<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TabQR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ── Main popup card ── -->
  <div class="popup" id="popup">

    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div class="logo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <rect x="2" y="2" width="8" height="8" rx="1.5" fill="currentColor"/>
            <rect x="14" y="2" width="8" height="8" rx="1.5" fill="currentColor"/>
            <rect x="2" y="14" width="8" height="8" rx="1.5" fill="currentColor"/>
            <rect x="14" y="14" width="3" height="3" rx="0.5" fill="currentColor" opacity="0.5"/>
            <rect x="19" y="14" width="3" height="3" rx="0.5" fill="currentColor" opacity="0.5"/>
            <rect x="14" y="19" width="3" height="3" rx="0.5" fill="currentColor" opacity="0.5"/>
            <rect x="19" y="19" width="3" height="3" rx="0.5" fill="currentColor"/>
          </svg>
        </div>
        <span class="app-name">TabQR</span>
      </div>
      <button class="theme-btn" id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">
        <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>

    <!-- Page info -->
    <div class="page-info" id="pageInfo">
      <img class="favicon" id="favicon" src="" alt="" />
      <div class="page-text">
        <div class="page-title" id="pageTitle">Loading…</div>
        <div class="page-url" id="pageUrl"></div>
      </div>
    </div>

    <!-- QR code area -->
    <div class="qr-wrapper">
      <div class="qr-container" id="qrContainer">
        <!-- QR canvas injected here by JS -->
      </div>
      <div class="qr-error" id="qrError" hidden>
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <p id="qrErrorMsg">Unable to generate QR code.</p>
      </div>
    </div>

    <!-- Action buttons -->
    <div class="actions" id="actions">

      <button class="btn btn-primary" id="copyBtn" title="Copy URL to clipboard">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        <span id="copyLabel">Copy Link</span>
      </button>

      <button class="btn btn-whatsapp" id="whatsappBtn" title="Share via WhatsApp">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/>
        </svg>
        WhatsApp
      </button>

      <button class="btn btn-download" id="downloadBtn" title="Download QR as PNG">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Save QR
      </button>

      <button class="btn btn-share" id="shareBtn" title="Share via native share sheet" hidden>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
        Share
      </button>

    </div>

    <!-- Footer -->
    <div class="footer">
      <div>Scan with your phone camera to open this page</div>

      <a
        class="credit"
        href="https://www.linkedin.com/in/byarugabajesse/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Created by Byarugaba Jesse
      </a>
    </div>

  </div>

  <!-- qrcode.js from CDN — pure JS, no dependencies -->
  <script src="libs/qrcode.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
